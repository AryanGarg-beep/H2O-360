<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Groundwater Level Prediction</title>

    <style>
        /* ===== PAGE BACKGROUND ===== */
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(180deg, #f8fafc, #eef2f7);
            padding: 60px 20px;
        }

        /* ===== CARD ===== */
        .gw-container {
            max-width: 720px;
            margin: auto;
            background: white;
            padding: 48px 52px;
            border-radius: 22px;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.08);
            border: 2px solid #90e0ef;
        }

        /* ===== HEADINGS ===== */
        .gw-container h2 {
            text-align: center;
            font-size: 40px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .gw-subtitle {
            text-align: center;
            font-size: 16px;
            color: #475569;
            max-width: 520px;
            margin: 0 auto 40px;
        }

        /* ===== FORM GRID ===== */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px 28px;
        }

        /* ===== LABELS ===== */
        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        /* ===== INPUTS ===== */
        input,
        select {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            outline: none;
            background: #ffffff;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus,
        select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        /* ===== FULL WIDTH ===== */
        button {
            grid-column: span 2;
        }

        /* ===== BUTTON ===== */
        button {
            margin-top: 30px;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            background: linear-gradient(135deg, #48cae4, #0077b6);
            box-shadow: 0 12px 30px rgba(2, 132, 199, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 45px rgba(2, 132, 199, 0.45);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .gw-container {
                padding: 36px 28px;
            }

            form {
                grid-template-columns: 1fr;
            }

            button {
                grid-column: span 1;
            }

            .gw-container h2 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="gw-container">
        <h2>Groundwater Level Prediction</h2>
        <p class="gw-subtitle">
            Provide historical groundwater observations and well details to
            predict groundwater levels for the selected year.
        </p>

        <form action="/groundwater-predict" method="POST">

            <label>GW Lag (Same Season, Last Year)</label>
            <input type="number" step="0.01" name="lag_same" required>

            <label>GW Level (Previous Observation)</label>
            <input type="number" step="0.01" name="lag" required>

            <label>Well Depth (meters)</label>
            <input type="number" step="0.1" name="depth" required>

            <label>Season</label>
            <select name="season" required>
                <option value="0">Pre-monsoon</option>
                <option value="1">Post-monsoon</option>
            </select>

            <label>Well Type</label>
            <select name="type" required>
                <option value="0">Piezometer</option>
                <option value="1">Dug Well</option>
            </select>

            <label>Source</label>
            <select name="source" required>
                <option value="0">SGWD</option>
            </select>

            <label>Aquifer (numeric code)</label>
            <input type="number" name="aquifer" required>

            <label>Year</label>
            <input type="number" name="year" value="2024" required>

            <label>State LGD Code</label>
            <input type="number" name="state_lgd" placeholder="e.g. 24 for Gujarat" required>

            <button type="submit">Predict Groundwater Level</button>

        </form>
    </div>

</body>
</html>
