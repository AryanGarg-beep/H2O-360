<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Water Consumption Forecast | H2O-360°</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lato', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f8fafc, #eef2f7);
            color: #0f172a;
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 56px;
            background: white;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            color: #0284c7;
            letter-spacing: 0.5px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: 600;
            color: #334155;
        }

        /* ---------- HERO ---------- */
        .hero {
            max-width: 1100px;
            margin: 60px auto 30px;
            padding: 60px;
            border-radius: 28px;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
            box-shadow: 0 30px 70px rgba(15, 23, 42, 0.12);
            text-align: center;
            animation: fadeUp 0.8s ease forwards;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero-content h2 {
            font-size: 28px;
            color: #0284c7;
            margin-bottom: 10px;
        }

        .hero-content p {
            font-size: 17px;
            color: #475569;
            max-width: 620px;
            margin: 0 auto;
        }

        /* ---------- FORM ---------- */
        .form {
            max-width: 420px;
            margin: 40px auto 80px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeUp 0.9s ease forwards;
        }

        .form label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .form input,
        .form select {
            padding: 14px;
            font-size: 16px;
            border-radius: 14px;
            border: 1px solid #cbd5f5;
            outline: none;
        }

        .form input:focus,
        .form select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2,132,199,0.15);
        }

        .form button {
            margin-top: 20px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            background: linear-gradient(135deg, #48cae4, #0077b6);
            box-shadow: 0 14px 35px rgba(2,132,199,0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 45px rgba(2,132,199,0.45);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">H2O-360°</div>
    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/live" target="_blank">Live</a></li>
    </ul>
</nav>

<main>

<section class="hero">
    <h1>Water Consumption Forecast</h1>
    <div class="hero-content">
        <h2>Ward-Level Demand Prediction</h2>
        <p>
            Forecast monthly water demand to support
            efficient and data-driven distribution planning.
        </p>
    </div>
</section>

<form class="form" method="POST" action="/forecast">

    <label>Ward Name</label>
    <input type="text" id="ward_name" list="ward-name-list" autocomplete="off" required>

    <datalist id="ward-name-list">
        {% for name in names %}
        <option value="{{ name }}"></option>
        {% endfor %}
    </datalist>

    <label>Ward Number</label>
    <input type="text" id="region" name="region" list="ward-list" autocomplete="off" required>

    <datalist id="ward-list">
        {% for ward in wards %}
        <option value="{{ ward }}"></option>
        {% endfor %}
    </datalist>

    <label>Time Period</label>
    <select name="time" required>
        {% for i in range(1,7) %}
        <option value="{{ i }}">{{ i }} Month{{ '' if i == 1 else 's' }}</option>
        {% endfor %}
    </select>

    <button type="submit">Generate Forecast</button>
</form>

</main>

<script>
const wardMap = {{ ward_map | tojson | safe }};
const reverseWardMap = {{ reverse_ward_map | tojson | safe }};

const wardNumberInput = document.getElementById("region");
const wardNameInput = document.getElementById("ward_name");

function lock(input) {
    input.readOnly = true;
    input.style.opacity = "0.6";
}

function unlock(input) {
    input.readOnly = false;
    input.style.opacity = "1";
}

wardNumberInput.addEventListener("input", () => {
    const num = wardNumberInput.value.trim();
    if (wardMap[num]) {
        wardNameInput.value = wardMap[num];
        lock(wardNameInput);
    } else unlock(wardNameInput);
});

wardNameInput.addEventListener("input", () => {
    const name = wardNameInput.value.trim();
    if (reverseWardMap[name]) {
        wardNumberInput.value = reverseWardMap[name];
        lock(wardNumberInput);
    } else unlock(wardNumberInput);
});
</script>

</body>
</html>
